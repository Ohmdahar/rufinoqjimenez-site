<title>Artist Statement — Systems Schematic (Interactive)</title>
<style>
  html,body{margin:0;padding:0;background:#e8e6e1;}

  svg{display:block;width:100%;height:auto;}
  @media print{ html,body{background:#fff;padding:0;} figure{box-shadow:none;max-width:none;} }

  /* hover animation: the motion is the mechanism */
  @keyframes march   {to{stroke-dashoffset:-24}}
  @keyframes marchr  {to{stroke-dashoffset:-30}}
  @keyframes drawin  {to{stroke-dashoffset:0}}
  @keyframes breathe {from{opacity:.22}to{opacity:.6}}
  #pI:hover .draw  {stroke-dasharray:1;stroke-dashoffset:1;animation:drawin 1.5s ease-in-out forwards}
  #pII:hover .draw {stroke-dasharray:1;stroke-dashoffset:1;animation:drawin .9s ease-in forwards}
  #pII:hover .draw2{stroke-dasharray:1;stroke-dashoffset:1;animation:drawin .45s ease-out .95s forwards}
  #pIII:hover .flow, #pIV:hover .flow, #pV:hover .flow {stroke-dasharray:7 5;animation:march .9s linear infinite}
  #pIII:hover .drift, #pIV:hover .drift, #pV:hover .drift, #pDG:hover .drift {animation:march 1.2s linear infinite}
  #pIV:hover .hex {animation:breathe 2.2s ease-in-out infinite alternate}
  #pV:hover .rim  {animation:march 4s linear infinite}
  svg:hover .redflow {stroke-dasharray:9 6;animation:marchr 1s linear infinite}
  @media (prefers-reduced-motion: reduce){ svg * {animation:none !important} }
</style>
