<style>

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0b0c10; --sheet:#14161c; --ink:#e9e6df; --ink-2:#aaa69d; --ink-3:#76736b;
      --rule:#2a2d35; --rule-2:#454955; --red:#d8604a; --red-soft:rgba(216,96,74,.12);
      --plate:#000; --shadow:0 2px 18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0b0c10; --sheet:#14161c; --ink:#e9e6df; --ink-2:#aaa69d; --ink-3:#76736b;
    --rule:#2a2d35; --rule-2:#454955; --red:#d8604a; --red-soft:rgba(216,96,74,.12);
    --plate:#000; --shadow:0 2px 18px rgba(0,0,0,.6);

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.55;padding-inline:clamp(16px,4vw,40px);font-feature-settings:"kern","liga"}
  img,video{max-width:100%}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-2);text-decoration-thickness:1px;text-underline-offset:.16em}
  a:hover{text-decoration-color:var(--red)}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px}
  ::selection{background:var(--red-soft)}
  h1,h2,h3{font-weight:400;text-wrap:balance}
  i,em{font-style:italic}

  .site{max-width:1080px;margin:0 auto;min-height:100%}

  /* header */
  .top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 28px;padding-block:22px 0;border-bottom:1px solid var(--rule)}
  .name{font-family:var(--mono);font-size:.875rem;letter-spacing:.04em;text-decoration:none;color:var(--ink);padding-bottom:14px}
  .nav{display:flex;gap:22px;overflow-x:auto;white-space:nowrap;font-family:var(--mono);font-size:.8125rem;letter-spacing:.02em;scrollbar-width:none;max-width:100%}

  /* page head */
  .page-head{padding-block:clamp(36px,6vw,64px) 28px;display:grid;gap:18px}
  .page-title{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.24em;font-size:clamp(1.3rem,3.4vw,2rem);margin:0;line-height:1.2}
  .standfirst{font-size:clamp(1.15rem,2.1vw,1.4rem);font-weight:300;line-height:1.42;max-width:34em;margin:0;text-wrap:pretty}

  /* prose */
  .prose{max-width:66ch}
  .prose p{margin:0 0 1.1em;text-wrap:pretty}
  .prose p:last-child{margin-bottom:0}
  .label{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px;font-weight:500}

  .intro{padding-block:6px 40px}
  .statement h2{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--ink-2);margin:2.2em 0 .8em;padding-top:.9em;border-top:1px solid var(--rule);max-width:66ch}

  .wt{font-style:italic;font-size:1.05rem}

  /* schematic: a sheet with its own paper, in every theme */
  .sheet{background:var(--paper);box-shadow:var(--shadow);padding:clamp(8px,2vw,22px);max-width:820px}
  .schematic svg{display:block;width:100%;height:auto}
  @keyframes march{to{stroke-dashoffset:-24}}
  @keyframes marchr{to{stroke-dashoffset:-30}}
  @keyframes drawin{to{stroke-dashoffset:0}}
  @keyframes breathe{from{opacity:.22}to{opacity:.6}}
  .schematic #pI:hover .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawin 1.5s ease-in-out forwards}
  .schematic #pII:hover .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawin .9s ease-in forwards}
  .schematic #pII:hover .draw2{stroke-dasharray:1;stroke-dashoffset:1;animation:drawin .45s ease-out .95s forwards}
  .schematic #pIII:hover .flow,.schematic #pIV:hover .flow,.schematic #pV:hover .flow{stroke-dasharray:7 5;animation:march .9s linear infinite}
  .schematic #pIII:hover .drift,.schematic #pIV:hover .drift,.schematic #pV:hover .drift,.schematic #pDG:hover .drift{animation:march 1.2s linear infinite}
  .schematic #pIV:hover .hex{animation:breathe 2.2s ease-in-out infinite alternate}
  .schematic #pV:hover .rim{animation:march 4s linear infinite}
  .schematic svg:hover .redflow{stroke-dasharray:9 6;animation:marchr 1s linear infinite}
  @media (prefers-reduced-motion: reduce){.schematic svg *{animation:none !important}}

  .mark{font-family:var(--mono);font-size:1rem;color:var(--ink-2);width:1em;text-align:center;flex:none}

  .fold.inline{border:0}

  <!-- ============ DRAWINGS ============ -->
  <template id="t-drawings">
    <div class="page-head">
      <h1 class="page-title">Drawings</h1>
    </div>
    <div class="prose intro">
      <p>The drawings are where the practice began and where its first principle was found. In the charcoal room and the large-format works the lines guide the eye without resolving it, and every visitor sees something different. That is the Rorschach principle: an ambiguous mark is a signal in its high-entropy state, doing no work in itself; the mind takes it and rapidly hallucinates a pattern from its own schema, converting an anergic signal into cognitive exergy. The schema is the conversion apparatus, so the same wall holds a different drawing for each person who stands in front of it. The pastel works carry the same principle in colour.</p>
    </div>

  <!-- ============ CONCEPTUAL ============ -->
  <template id="t-conceptual">
    <div class="page-head">
      <h1 class="page-title">Conceptual</h1>
    </div>
    <div class="prose intro">
      <p>The conceptual works are the practice at the level of its structure. Each takes one part of how a work of art holds and makes that part the work. <i>A drawing of all art that has ever been or will be</i> draws the structure of art itself from a small set of axioms; it was performed on a chalkboard, walked through aloud and erased, and what exists now is a facsimile, an incomplete memory. <i>where does the sadness lie, gregg bordowitz</i> takes the body's register: a year of grief, dried to salt, seeding a crystal that grew a form of its own. <i>Artist Statement</i> is the statement drawn as the system it describes, with the reader entering from outside. <i>The Ethics of Entropy</i> maps the entangled structure of the research itself, more than two thousand atomic ideas and the relations between them on a hyperbolic disk, run as a thermodynamics; it is a conceptual work and it is the research, the framework operating on itself, complete only to the edge of its own frame. These works are evaluated the way systems aesthetics proposes: by their inputs, their outputs and their relational structure rather than by their material properties.</p>
    </div>

        </figcaption>

  <!-- ============ PHD RESEARCH ============ -->
  <template id="t-research">
    <div class="page-head">
      <h1 class="page-title">PhD Research</h1>
      <p class="standfirst"><i>The Ethics of Entropy</i>: a practice-research PhD in systems aesthetics and systems theory at <a href="https://www.gold.ac.uk/pg/mphil-phd-arts-computational-tech/" target="_blank" rel="noopener">Goldsmiths, University of London</a>, begun in January 2026. Everything made during the doctorate lands here.</p>
    </div>

    <figure class="work plate video">
      <video controls muted loop playsinline preload="metadata" poster="img/r-poster.jpg" width="1280" height="720">
        <source src="media/ect-map-tour.mp4" type="video/mp4">
      </video>
      <figcaption>
        <span class="wt">The Ethics of Entropy</span><span class="wm">2026 · browser-based interactive work · filmed tour, two minutes</span>
        <span class="wn">The research vault as a hyperbolic node map. The map itself is not published online; it is shown in person.</span>
      </figcaption>
    </figure>

    <section class="section">
      <p class="label">Statement</p>
      <div class="prose">
        <p>My work bridges non-equilibrium thermodynamics and systems aesthetics to build a living architecture for art. In the doctorate it takes the form of an interactive digital map: more than two thousand atomic ideas from my research, mapped onto a hyperbolic disk and run as a thermodynamics, with a drawn schematic beside it carrying the mathematics. What I am attempting is a standard model of systems aesthetics, the pattern beneath the patterns. As Descartes found one geometry beneath every figure by giving space coordinates, I am looking for the common architecture beneath every system that persists: the property that emerges wherever matter, life, or thought organises against a gradient, and that feeds into everything else, from ecology to economics to cognition to art itself.</p>
        <p>The framework begins with three givens. The speed of light is also the speed of causality. Because that speed is constant for every observer, time itself becomes relative; what stays invariant is the order in which causes can reach effects. That invariant order is the system all events must follow, and therefore all systems, which are made of events. Entropy gives the order its direction. And physics itself supplies the third given, the long ambition running from Newton's unifications to the standard model and the search beyond it, that there is an underlying structure to everything. Together they ground the claim at the centre of my work: systems are an emergent property of entropy moving through causality. Whatever persists, persists by circulating, holding its shape through the small, continuous adjustments that meet its gradient; what fails to meet it collapses and reorganises, locally or across scales. Here it is enough to watch how systems hold, fall, and reorganise.</p>
        <details class="fold inline">
          <summary><span class="mark" aria-hidden="true"></span></summary>
          <div>
            <p>My work is with systems, and systems show us how truth obeys physics. A truth is a dissipative structure that exists within a convection of validation. It holds its shape by processing the new through itself; sealed away from that flow, it stills into dogma, which cannot prove itself from within.</p>
            <p>This is one architecture surfacing across disciplines. Gödel proved that no formal system can demonstrate its own consistency from within; Hume showed that no account of what is can, on its own, yield what ought to be. Truth held in the convection of validation, the incompleteness of formal systems, and the gap Hume's guillotine cuts all share the same shape: every system that persists requires an outside to complete it. For the formal system that outside is an axiom it cannot prove; for the is, an ought it cannot derive; for a truth, the validation it cannot give itself, which arrives through use, construction, and form.</p>
            <p>Beneath the mapping is the reason for it. To see how systems hold, fall, and reorganise is to see what our will does when it enters them. The framework is an architecture for realising the implications of our actions on the system dynamics we live inside: ethics as diagnosis, and as the small adjustments that steer a severed circulation back toward its gradient.</p>
            <p>The map itself is not a closed archive but a living research boundary, reorganising as returns arrive from an outside reality of matter, ideas, mathematics, and other minds. I work in the lineage of systems aesthetics: Jack Burnham's turn from objects to the relations that produce them, and Agnes Denes, who mapped her philosophy graphically and re-projected the world onto new geometries, making art about systems and from them. The schematic continues Denes's gesture. It is this statement drawn as the system it describes, and this statement is itself part of that system: as practice research it performs what it argues, validating and contextualising the art as art, situating the work within a schema. Your reading completes the circuit, attention entering the work as validation and placing it, from outside, within the boundary of art.</p>
          </div>
        </details>
      </div>
    </section>

    <div class="folds">
      <details class="fold" open>
        <summary><span>What you are looking at</span><span class="mark" aria-hidden="true"></span></summary>
        <div class="fold-body prose">
          <p>Every point of light is one atomic idea from the research: a claim, a source, an operator, a piece of evidence, a mechanism, a question or a definition. Every line is a typed relation between two of them. The map is built from the vault directly, 2,232 nodes and 6,970 relations at the current build, and it changes when the research changes: a new argument opens new sources at the rim, a settled one deepens towards the centre, and a failed one folds its own region of the disk.</p>
          <p>The space is hyperbolic, a Poincaré disk. The most-connected operators sit near the centre; specific claims and evidence fan out to the rim, which is infinitely far from every node. Inward is towards the core; outward is towards its particulars. The most-connected node in the map, the one the geometry places nearest the centre, is the convection of validation.</p>
        </div>
      </details>
      <details class="fold">
        <summary><span>The energy overlay, in the framework's own terms</span><span class="mark" aria-hidden="true"></span></summary>
        <div class="fold-body prose">
          <p>Exergy enters at the sources. Source material is stored information, potential: it enters as usable free energy and flows downstream into the claims that cite it. Read through a schema, it converts into what is accepted, which fuels the framework, and what is left open.</p>
          <p>Anergy pools at open questions. It can still convert, at an adjacent system's boundary conditions rather than inside its own: anergy downstreams and becomes exergy in a neighbouring system, the way a question one field sets aside becomes the working premise of another. A dropped or stale concept is anergy gone cold, a terminal pool. A dispute pools anergy on the smooth surface and, like an open question, can still resolve at a conversion point or cross the fold.</p>
          <p>Bridges reconvert it. Where a question reaches a bridge the change happens in thought: the anergy downstreams there and returns as exergy in a different system of ideas, flowing onward into new claims.</p>
          <p>The fold has two outcomes. The cusp is a premise that reorganised through it, discharging new exergy onward; the catastrophe is a premise that could not recompose, collapsed into a void. When a claim is validated by data or philosophy at other scales, that validation returns to the core concepts it instantiates, the nested return: the convection of validation.</p>
        </div>
      </details>
      <details class="fold">
        <summary><span>The framework</span><span class="mark" aria-hidden="true"></span></summary>
        <div class="fold-body prose">
          <p>Entropy Circulation Topology reads persisting systems as circulations and distinguishes two shapes of conversion: a circulatory topology returns what it converts to the systems that sustain it; an extractive topology linearises the loop, takes the gradient, and leaves the cost to pool elsewhere. The ethics in the title is diagnostic: it asks where a circulation has been cut and what has been put in its place. The framework is operating on itself in the map, complete only to the edge of its own frame.</p>
        </div>
      </details>
    </div>

  <template id="t-statement">
    <div class="page-head">
      <h1 class="page-title">Artist Statement</h1>
    </div>
    <div class="prose intro statement">
      <p>My work falls within systems aesthetics. What I make is evaluated the way Jack Burnham proposed in 1968: by its inputs, its outputs and its relational structure rather than by its material properties. The lineage runs through Agnes Denes, who mapped the processes of thought on graph paper, plotting evolution, time and truth as continuous forms, and named the practice Visual Philosophy; through Joseph Beuys, who drew his Energy Plan for the Western Man on blackboards and treated creativity, society and meaning as flows of energy and warmth passing through works of art; and back to Marcel Duchamp, who worked directly on the systems within art and cognition with the readymades, and who named the gap between what an artist intends and what the work expresses, the art coefficient, across which the spectator completes the creative act.</p>
      <p>One principle runs through all of my works. Truth persists through circulation. A truth that circulates, agitated by the other variables flowing through the system and incorporating what returns, keeps its shape because the circulation keeps validating it; a truth cut off from that circulation degrades into dogma, not because its content changed but because its topology did. I call this the convection of validation. My works exist within this entangled topology. As an artist I am merely pulling the threads to see what it reveals.</p>
      <h2>Encounter</h2>
      <p>In the charcoal room and the large-format drawings the lines guide the eye without resolving it, and every visitor sees something different. The scale of the work exceeds the visual field, so the image disentangles at the periphery; composition, and the play of high and low contrast, give the eye direction. Together these give the work a sense of causality, and therefore a narrative, whose resolution the drawing withholds. That is the Rorschach principle at work. An ambiguous mark is a signal in its high-entropy state, doing no work in itself; the mind takes it and rapidly hallucinates a pattern from its own schema, converting an anergic signal into cognitive exergy, into work capacity. The schema is the conversion apparatus. The work the artwork does is the conversion the viewer's schema performs on it, which is why the same wall holds a different drawing for each person who stands in front of it.</p>
      <h2>Structure</h2>
      <p><i>A drawing of all art that has ever been or will be</i> began as a refusal: asked to write a thesis about art, which resists definition, I drew its formula instead. From a small set of axioms, the morphology of manifolds, the formula of visible colour, thermodynamics as the formula of intelligence, the systems of emotion, a single drawing generates every work that has been made or could be made. It was performed on a chalkboard at my MFA defence, walked through aloud, questioned and corrected at the board, and erased; the object that exists now is a facsimile made years later, an incomplete memory. It is the abstraction the schema realises, drawn as the system it describes.</p>
      <h2>Body</h2>
      <p><i>where does the sadness lie, gregg bordowitz</i> takes its title from a question of Bordowitz's: a sad artist paints and a viewer feels sad, so where does the sadness lie, in the artist, the painting or the viewer? For a year I kept every tear I shed in grief. Dried, the salt became the seed of a crystal grown in a supersaturated solution: a year of grief spawning a form of its own. The somatic register is a primary register of exergy processing in its own right, alongside cognition and emotion rather than downstream of them: tears, goosebumps, the shiver at a chord are the body processing exergy, and at times completing a conversion that cognition could not. What the body discharges is anergy at the scale of one mind and exergy at the scale of two: the tear is involuntary, and so legible, and so does its work in whoever sees it. The crystal is that processing given time enough to become a form.</p>
      <h2>Map</h2>
      <p><i>The Ethics of Entropy</i> is my doctoral research: an expanding field of more than two thousand atomic ideas and the relations between them, mapped onto a hyperbolic disk by the framework's own principles and run as a thermodynamics: exergy entering at the sources, anergy pooling at the open questions, reconversion at the bridges where one field's set-aside question becomes another's working premise, reorganisation or collapse at the fold, and the nested return of validation to the core concepts it re-grounds. The most connected idea, the one the geometry places nearest the centre, is the convection of validation. The framework is operating on itself, complete only to the edge of its own frame. The large charcoal drawings composed on hyperbolic structure, and the polished steel iteration that follows them, belong to the same map.</p>
      <h2>Entanglement</h2>
      <p>A system cannot validate itself from within. Each of these works is a boundary, porous by design, nested in the systems that hold it: the room, the practice, the research, and the outside reality of matter, ideas, mathematics and other minds from which returns arrive. Its state is entangled with that environment; what the work is depends on what flows through it. Your attention enters the work as validation and places it, from outside, within the boundary of an artistic practice. That entanglement is the fifth station, and it is the one the work cannot supply for itself.</p>
    </div>
    <section class="section">
      <div class="prose"><p>The statement drawn as the system it describes: <a href="#conceptual"><i>Artist Statement</i>, 2026</a>, in Conceptual.</p></div>
    </section>

<script>
(function(){
  var page = document.getElementById('page');
  var links = Array.prototype.slice.call(document.querySelectorAll('.nav a'));
  var current = '';
  function show(id){
    var t = document.getElementById('t-' + id);
    if(!t){ id = 'home'; t = document.getElementById('t-home'); }
    if(id === current) return;
    current = id;
    while(page.firstChild) page.removeChild(page.firstChild);
    page.appendChild(t.content.cloneNode(true));
    links.forEach(function(a){
      if(a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    try { window.scrollTo(0, 0); } catch(e){}
  }
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if(!a) return;
    var id = a.getAttribute('href').slice(1);
    if(!document.getElementById('t-' + id)) return;
    e.preventDefault();
    e.stopPropagation();
    show(id);
  }, true);
  var start = 'home';
  try { start = (location.hash || '#home').replace('#', ''); } catch(e){}
  show(start);
})();
</script>
